<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Your treeti verification code</title></head>
  <body style="margin:0;padding:32px 20px;background:#f7f6f3;color:#191919;font-family:Arial,Helvetica,sans-serif;line-height:1.6">
    <main style="max-width:480px;margin:0 auto;padding:32px;background:#ffffff;border:1px solid #e4e2df;border-radius:20px">
      <p style="margin:0 0 24px;font-size:28px;font-weight:bold">treeti<span style="color:#9c62f8">.</span></p>
      <h1 style="margin:0 0 12px;font-size:24px;line-height:1.3">Your verification code</h1>
      <p style="margin:0 0 24px">Enter this code in treeti to continue with the action you started.</p>
      <p style="margin:0 0 24px;padding:16px;background:#f3eefb;border-radius:12px;font-family:monospace;font-size:28px;font-weight:bold;text-align:center;letter-spacing:4px">{{ .Token }}</p>
      <p style="margin:0 0 16px;color:#555555">Keep this code private. If it expires, request a new code in treeti.</p>
      <p style="margin:0;color:#555555">If you didn’t request this code, you can ignore this email.</p>
    </main>
  </body>
</html>
